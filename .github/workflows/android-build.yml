name: Android CI/CD Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for publishing APK to GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore or Generate Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        continue-on-error: true
        with:
          name: kindle-pdf-reader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
          overwrite: true

      - name: Publish APK to GitHub Releases (Bypass Quota)
        if: success() && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Preparing APK for GitHub Release..."
          cp app/build/outputs/apk/debug/*.apk Kindle-PDF-Reader-Latest.apk
          
          echo "Deleting previous automated release tag if existing..."
          gh release delete latest-build --cleanup-tag --yes || true
          
          echo "Creating new GitHub Release with APK asset..."
          gh release create latest-build Kindle-PDF-Reader-Latest.apk \
            --title "📱 Latest Kindle PDF Reader Build (APK)" \
            --notes "Automated build from branch \`${{ github.ref_name }}\` (Commit: \`${{ github.sha }}\`).<br><br>📥 **How to install:** Click \`Kindle-PDF-Reader-Latest.apk\` below to download and install on your Android device." \
            --latest
